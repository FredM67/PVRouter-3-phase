---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# See CONTRIBUTING.md for installation instructions

ci:
  autoupdate_commit_msg: 'ci(pre-commit): autoupdate hooks'
  autoupdate_schedule: quarterly
  skip:
    # Date stamping is a local convenience: on CI it would rewrite headers with
    # the build date, which has nothing to do with when the code was edited.
    - update-metadata
    # graphify is not installed on CI; the hook would skip anyway, but CI runs no system tools.
    - graphify-graph

# graphify-out/graph.json is generated (one long JSON line, several MB): no hook checks it.
exclude: ^graphify-out/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=dev
      - id: end-of-file-fixer
        exclude: ^(.*/)?\.vscode/|\.drawio$|^sim/avr_adc\.c$
      - id: trailing-whitespace
        exclude: ^(.*/)?\.vscode/|\.drawio$|^sim/avr_adc\.c$
      - id: check-yaml
        exclude: ^(\.clang-format|(.*/)?\.vscode/)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^(.*/)?\.vscode/|\.drawio$|^sim/avr_adc\.c$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: ^sim/avr_adc\.c$  # vendored from simavr, kept as upstream

  - repo: local
    hooks:
      - id: update-metadata
        name: update @date / @copyright headers
        entry: scripts/hooks/update-metadata.sh
        language: script
        types_or: [c, c++]
        exclude: ^sim/avr_adc\.c$
      - id: graphify-graph
        name: rebuild graphify-out/graph.json (skipped without graphify)
        entry: scripts/hooks/graphify-update.sh
        language: script
        pass_filenames: false
        # the file types graphify indexes as code: a commit of docs only leaves the graph alone
        types_or: [c, c++, python, javascript, shell, yaml, json]
