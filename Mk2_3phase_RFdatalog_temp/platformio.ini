; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Router program
default_envs = basic
src_dir = ./

[common]
; -Wl,--relax: the linker turns a call or jump into its 2-byte relative form (rcall, rjmp) when
; the target is within 4 KB - about 270 bytes less flash. The vector table keeps its 4-byte slots.
; -DONEWIRE_SEARCH=0: the firmware addresses its sensors by their ROM codes, it never searches the
; bus. Without the search, OneWire is 48 bytes smaller and its object 11 bytes of RAM smaller
; (with temperature sensing only: otherwise, OneWire is not built in).
build_flags =
    -Wextra
    -std=c++17
    -std=gnu++17
    -Wl,--relax
    -DONEWIRE_SEARCH=0

; -fpermissive (added by the Arduino core): it turns errors into warnings, such as an overflow in
; a constant expression. 10 to 12 hours of off-peak overflowed that way in dualtariff.h, with
; nothing but a warning in the build output (#214).
build_unflags =
    -fpermissive
    -std=c++11
    -std=gnu++11
lib_deps =
    lowpowerlab/RFM69 @ ^1.5.2

[env:uno]
platform = atmelavr
framework = arduino
board = uno
test_ignore = native/*
extra_scripts = pre:inject_sketch_name.py
build_flags =
    ${common.build_flags}
build_unflags =
    ${common.build_unflags}
lib_deps =
    ${common.lib_deps}
    paulstoffregen/OneWire @ ^2.3.8

check_tool = clangtidy ;, cppcheck
check_flags =
    cppcheck: --enable=all --std=c++17 --suppress=missingIncludeSystem
    clangtidy: --extra-arg=-std=c++17 --checks=*,-llvmlibc-callee-namespace,-llvmlibc-implementation-in-namespace,-clang-diagnostic-c++17-extensions,-llvm-header-guard,-readability-identifier-naming,-cppcoreguidelines-avoid-c-arrays,-hicpp-avoid-c-arrays,-modernize-avoid-c-arrays,-hicpp-no-assembler,-modernize-use-trailing-return-type
check_skip_packages = yes
check_src_filters =
    +<./>
    -<test/>
    -<.pio/libdeps/>

; Serial Monitor options
monitor_filters =
    default   ; Remove typical terminal control codes from input
    time      ; Add timestamp with milliseconds for each new line
    log2file  ; Log data to a file “platformio-device-monitor-*.log” located in the current working directory

; Unit Testing options

[env:basic]
extends = env:uno
build_src_filter =
    ${env.build_src_filter}
    -<test/>

[env:basic_debug]
extends = env:basic
build_type = debug

[env:native]
platform = native
test_ignore = embedded/*

; Embedded tests in the simavr simulator: a bare ATmega328P at 16 MHz, UART0 on stdout.
; Free and unlimited, runs in CI and locally (Linux/WSL):
;   pio test -e uno_sim
[env:uno_sim]
extends = env:uno
platform_packages = platformio/tool-simavr
lib_deps =
    ${env:uno.lib_deps}
    ; reference for the JSON number format in test_serial_output (the firmware no longer uses it)
    bblanchon/ArduinoJson @ ^6.*
; nothing to upload, the firmware is loaded by simavr itself
upload_protocol = custom
upload_command = echo "uno_sim: no upload, the firmware runs in simavr"
test_speed = 9600
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega328p
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
