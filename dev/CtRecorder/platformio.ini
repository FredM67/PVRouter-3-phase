; PlatformIO Project Configuration File
;
; CT recorder: records the router's own ADC chain (voltage and one current, no calibration) over
; the serial port, to compare a CT with the firmware's sample path.
;
;   pio run -e three_phase_old            3-phase router, old board
;   pio test -e native                    the sample path and the chain layouts, on the PC

[platformio]
description = CT recorder
default_envs = three_phase_old
src_dir = ./

; the five hardware flavours share this section
[hw]
platform = atmelavr
framework = arduino
board = uno
build_flags =
    -Wextra
    -std=c++17
    -std=gnu++17
    -I ../../Mk2_3phase_RFdatalog_temp
build_unflags =
    -std=c++11
    -std=gnu++11
; src_dir is this folder: build the sketch only, not the tests
build_src_filter = -<*> +<main.cpp>
monitor_speed = 500000

; -D CTR_ROUTER=THREE_PHASE|SINGLE_PHASE, -D CTR_BOARD=OLD|OLD_SEG|OLD_OLED|NEW (enums of chain_layout.h),
; -D CTR_PAIR=GRID|DIVERTED (single-phase: CT1 or CT2)
[env:three_phase_old]
extends = hw
build_flags =
    ${hw.build_flags}
    -D CTR_ROUTER=THREE_PHASE
    -D CTR_BOARD=OLD
    -D CTR_PAIR=GRID

[env:three_phase_new]
extends = hw
build_flags =
    ${hw.build_flags}
    -D CTR_ROUTER=THREE_PHASE
    -D CTR_BOARD=NEW
    -D CTR_PAIR=GRID

[env:single_phase_old_seg]
extends = hw
build_flags =
    ${hw.build_flags}
    -D CTR_ROUTER=SINGLE_PHASE
    -D CTR_BOARD=OLD_SEG
    -D CTR_PAIR=GRID

[env:single_phase_old_oled]
extends = hw
build_flags =
    ${hw.build_flags}
    -D CTR_ROUTER=SINGLE_PHASE
    -D CTR_BOARD=OLD_OLED
    -D CTR_PAIR=GRID

[env:single_phase_new]
extends = hw
build_flags =
    ${hw.build_flags}
    -D CTR_ROUTER=SINGLE_PHASE
    -D CTR_BOARD=NEW
    -D CTR_PAIR=GRID

[env:native]
platform = native
test_build_src = no
build_flags =
    -Wall
    -Wextra
    -std=c++17
    -I .
    -I ../../Mk2_3phase_RFdatalog_temp
