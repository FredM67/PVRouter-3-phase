# CI workflow for PVRouter-3-phase
# Runs build and tests on pull requests and on the long-lived branches
# Skips CI for documentation-only changes

name: CI
permissions:
  contents: read

on:
  # Pushes to feature branches are covered by their pull request,
  # so only the long-lived branches are built on push.
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# A new push to a pull request supersedes its running CI.
# Runs on main/dev are never cancelled, so every merged commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_DIR: Mk2_3phase_RFdatalog_temp

jobs:
  # Build job: compiles firmware for embedded targets.
  # One entry per user-selectable environment - `pio run` alone only builds
  # `default_envs` (basic), which let the rf environment break unnoticed.
  build:
    name: Build Firmware (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - basic
          - emonesp
          - rf
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Build firmware (${{ matrix.environment }})
        run: pio run --project-dir ${{ env.PROJECT_DIR }} -e ${{ matrix.environment }}

      # ATmega328P budget: 32256 bytes of flash (bootloader excluded), 2048 bytes of RAM.
      # Recorded in the job summary so refactorings can be compared against the base branch.
      - name: Report firmware size (${{ matrix.environment }})
        run: |
          ELF=${{ env.PROJECT_DIR }}/.pio/build/${{ matrix.environment }}/firmware.elf
          read -r TEXT DATA BSS _ < <(~/.platformio/packages/toolchain-atmelavr/bin/avr-size "$ELF" | tail -n 1)
          FLASH=$((TEXT + DATA))
          RAM=$((DATA + BSS))
          {
            echo "### Firmware size: \`${{ matrix.environment }}\`"
            echo ""
            echo "| Memory | Used | Budget | % |"
            echo "|---|---:|---:|---:|"
            echo "| Flash | $FLASH | 32256 | $((FLASH * 100 / 32256)) |"
            echo "| RAM (static) | $RAM | 2048 | $((RAM * 100 / 2048)) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Native tests: every test under test/native runs in a single job,
  # so a new test is picked up without editing this file.
  test-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Run native tests
        run: pio test --project-dir ${{ env.PROJECT_DIR }} -e native

  # Lists the embedded tests to run in the simulator.
  # Benchmarks (*_perf) are excluded: they measure timings, they don't assert behaviour.
  discover-embedded:
    name: Discover embedded tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          tests=$(find ${{ env.PROJECT_DIR }}/test/embedded -mindepth 1 -maxdepth 1 -type d ! -empty -name 'test_*' ! -name '*_perf' -printf '%f\n' | sort | jq -R . | jq -cs .)
          echo "Embedded tests: $tests"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  # Embedded test jobs: runs each test in Wokwi simulator
  test-embedded:
    name: Embedded (${{ matrix.test }})
    needs: discover-embedded
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    # Secrets are not available to Dependabot and fork pull requests: the test
    # firmware is still built, but the simulation steps are skipped.
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-embedded.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Build test firmware
        run: pio test --project-dir ${{ env.PROJECT_DIR }} -e uno -f "*${{ matrix.test }}*" --without-uploading --without-testing

      - name: Skip simulation (no Wokwi token)
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "::notice title=Wokwi skipped::WOKWI_CLI_TOKEN is not available to this run (Dependabot or fork pull request), ${{ matrix.test }} was built but not simulated."

      - name: Install Wokwi CLI
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          curl -L https://wokwi.com/ci/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "$HOME/.wokwi/bin" >> $GITHUB_PATH

      - name: Run ${{ matrix.test }} in Wokwi
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          wokwi-cli --timeout 60000 \
            --expect-text "OK" \
            --fail-text "FAIL" \
            --diagram-file ../diagram.json \
            --elf ${{ env.PROJECT_DIR }}/.pio/build/uno/firmware.elf \
            --serial-log-file wokwi-output.txt \
            ${{ env.PROJECT_DIR }}/test/embedded/${{ matrix.test }}

      - name: Convert Unity output to JUnit XML
        if: always() && env.WOKWI_CLI_TOKEN != ''
        run: |
          # Convert Unity test output to JUnit XML format
          python3 << 'EOF'
          import re
          from xml.etree.ElementTree import Element, SubElement, tostring
          from xml.dom import minidom

          with open('wokwi-output.txt', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          tests = re.findall(r'([^:]+):(\d+):([^:]+):(PASS|FAIL)', content)

          testsuites = Element('testsuites')
          testsuite = SubElement(testsuites, 'testsuite')
          testsuite.set('name', '${{ matrix.test }}')
          testsuite.set('tests', str(len(tests)))

          failures = 0
          for file, line, name, result in tests:
              testcase = SubElement(testsuite, 'testcase')
              testcase.set('name', name)
              testcase.set('classname', file.split('/')[-1])
              if result == 'FAIL':
                  failures += 1
                  failure = SubElement(testcase, 'failure')
                  failure.set('message', f'Test failed at {file}:{line}')

          testsuite.set('failures', str(failures))

          xml_str = minidom.parseString(tostring(testsuites)).toprettyxml(indent="  ")
          with open('test-results.xml', 'w') as f:
              f.write(xml_str)
          EOF

      - name: Publish test results
        if: always() && env.WOKWI_CLI_TOKEN != ''
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.test }}
          path: test-results.xml
          reporter: java-junit

      - name: Upload test artifacts
        if: always() && env.WOKWI_CLI_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test }}-output
          path: |
            wokwi-output.txt
            test-results.xml
