# CI workflow for PVRouter-3-phase
# Runs build and tests on pull requests and on the long-lived branches
# Skips CI for documentation-only changes

name: CI
permissions:
  contents: read

on:
  # Pushes to feature branches are covered by their pull request,
  # so only the long-lived branches are built on push.
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# A new push to a pull request supersedes its running CI.
# Runs on main/dev are never cancelled, so every merged commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_DIR: Mk2_3phase_RFdatalog_temp

jobs:
  # Build job: compiles firmware for embedded targets.
  # One entry per user-selectable environment - `pio run` alone only builds
  # `default_envs` (basic), which let the rf environment break unnoticed.
  # The serial entries set the output of config.h (no environment of their own, since Arduino
  # IDE users have no environments): IoT for the mk2Wifi module, HumanReadable for the serial
  # monitor, whatever the default of config.h.
  build:
    name: Build Firmware (${{ matrix.environment }}${{ matrix.serial && format(', {0}', matrix.serial) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: basic
          - environment: rf
          - environment: basic
            serial: IoT
          - environment: basic
            serial: HumanReadable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Select the ${{ matrix.serial }} serial output
        if: matrix.serial
        run: |
          sed -i -E 's/SERIAL_OUTPUT_TYPE = SerialOutputType::[A-Za-z]+;/SERIAL_OUTPUT_TYPE = SerialOutputType::${{ matrix.serial }};/' ${{ env.PROJECT_DIR }}/config.h
          grep -q 'SERIAL_OUTPUT_TYPE = SerialOutputType::${{ matrix.serial }};' ${{ env.PROJECT_DIR }}/config.h

      - name: Build firmware (${{ matrix.environment }})
        run: pio run --project-dir ${{ env.PROJECT_DIR }} -e ${{ matrix.environment }}

      # ATmega328P budget: 32256 bytes of flash (bootloader excluded), 2048 bytes of RAM.
      # Recorded in the job summary so refactorings can be compared against the base branch.
      - name: Report firmware size (${{ matrix.environment }})
        run: |
          ELF=${{ env.PROJECT_DIR }}/.pio/build/${{ matrix.environment }}/firmware.elf
          read -r TEXT DATA BSS _ < <(~/.platformio/packages/toolchain-atmelavr/bin/avr-size "$ELF" | tail -n 1)
          FLASH=$((TEXT + DATA))
          RAM=$((DATA + BSS))
          {
            echo "### Firmware size: \`${{ matrix.environment }}\`${{ matrix.serial && format(' ({0} serial output)', matrix.serial) || '' }}"
            echo ""
            echo "| Memory | Used | Budget | % |"
            echo "|---|---:|---:|---:|"
            echo "| Flash | $FLASH | 32256 | $((FLASH * 100 / 32256)) |"
            echo "| RAM (static) | $RAM | 2048 | $((RAM * 100 / 2048)) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # for the benchmark history (job benchmarks): smaller is better
          LABEL="${{ matrix.environment }}${{ matrix.serial && format(', {0}', matrix.serial) || '' }}"
          mkdir -p bench
          printf '[{"name": "flash: %s", "value": %d, "unit": "bytes"}, {"name": "RAM: %s", "value": %d, "unit": "bytes"}]\n' \
            "$LABEL" "$FLASH" "$LABEL" "$RAM" > "bench/size-${{ strategy.job-index }}.json"

      - name: Upload the size for the benchmark history
        uses: actions/upload-artifact@v7
        with:
          name: bench-size-${{ strategy.job-index }}
          path: bench/size-${{ strategy.job-index }}.json

  # The remote load receiver as the Arduino IDE builds it: only the files of its folder, in C++17.
  # utils_pins.h and utils_bits.h are copies of the router's, since the IDE sees nothing else.
  receiver-arduino:
    name: Remote Load Receiver (Arduino CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The receiver's copies match the router's files
        run: |
          for f in utils_pins.h utils_bits.h; do
            diff <(grep -v '@date' Mk2_3phase_RFdatalog_temp/$f) <(grep -v '@date' RemoteLoadReceiver/$f) \
              || { echo "::error file=RemoteLoadReceiver/$f::out of date, copy Mk2_3phase_RFdatalog_temp/$f here"; exit 1; }
          done

      # arduino-cli directly: arduino/compile-sketches pins a Python that newer runners lack.
      - uses: arduino/setup-arduino-cli@v2

      - name: Build with the Arduino CLI
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install RFM69_LowPowerLab
          arduino-cli compile --fqbn arduino:avr:uno --warnings default \
            --build-property compiler.cpp.extra_flags=-std=gnu++17 RemoteLoadReceiver

  # The configurator (configurator/, published by the Mk2PVRouter documentation): its default choices must give
  # back the shipped config files, the files it generates must build and be clang-format clean,
  # and its mk2Wifi YAML must be a valid ESPHome configuration.
  configurator:
    name: Configurator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-platformio

      - name: Unit tests
        run: node --test configurator/test/*.test.js

      - name: Install clang-format
        run: pip install clang-format==18.1.8

      - name: Build the presets
        run: bash configurator/test/compile-presets.sh

      # ESPHome supports Python < 3.15 only, while setup-platformio takes the newest one:
      # it gets its own Python, kept off the PATH, in a virtual environment.
      - name: Set up Python for ESPHome
        id: python-esphome
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          update-environment: false

      - name: Install ESPHome
        run: |
          "${{ steps.python-esphome.outputs.python-path }}" -m venv "$RUNNER_TEMP/esphome"
          "$RUNNER_TEMP/esphome/bin/pip" install esphome

      - name: Check the mk2Wifi YAML
        run: ESPHOME="$RUNNER_TEMP/esphome/bin/esphome" bash configurator/test/check-yaml.sh

  # Native tests: every test under test/native runs in a single job,
  # so a new test is picked up without editing this file.
  test-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Run native tests
        run: pio test --project-dir ${{ env.PROJECT_DIR }} -e native

  # Embedded tests: every test under test/embedded runs in the simavr simulator
  # (a bare ATmega328P at 16 MHz), benchmarks included - simavr is cycle-accurate,
  # so their figures are reproducible. Free and unlimited, no token needed.
  test-embedded:
    name: Embedded tests (simavr)
    runs-on: ubuntu-latest
    # a test that hangs before UNITY_END() would otherwise hold the runner for 6 hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      # verbose, for the BENCH| lines of the benchmarks (test/embedded/bench_report.h)
      - name: Run embedded tests in simavr
        run: pio test --project-dir ${{ env.PROJECT_DIR }} -e uno_sim -v | tee embedded-tests.log

      - name: Collect the benchmark results
        run: |
          mkdir -p bench
          python3 scripts/ci/bench_to_json.py embedded-tests.log > bench/speed.json
          {
            echo "### Benchmarks (simavr, exact)"
            echo ""
            echo "| Benchmark | Value | Unit |"
            echo "|---|---:|---|"
            jq -r '.[] | "| \(.name) | \(.value) | \(.unit) |"' bench/speed.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-speed
          path: bench/speed.json

  # The production firmware on a simulated 3-phase grid (sim/README.md):
  # regulation, load priorities, ISR timing and switching instants, no hardware needed.
  grid-sim:
    name: Grid simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      # src_dir = ./ puts .pio/libdeps in PlatformIO's project checksum: installing the
      # libraries of another environment would wipe every build, the basic one included
      # the old board and the human-readable datalog, which grid_sim reads (sim/README.md)
      - name: Build firmware (basic)
        run: |
          sim/configs/sim_config.sh
          pio pkg install --project-dir ${{ env.PROJECT_DIR }} -e basic -e rf
          pio run --project-dir ${{ env.PROJECT_DIR }} -e basic

      # the same scenarios on the new board: internal 1.1 V reference, calibration from calibration.h
      - name: Build firmware (new board)
        run: |
          sim/configs/sim_config.sh NEW
          PLATFORMIO_BUILD_DIR=.pio/build-new pio run --project-dir ${{ env.PROJECT_DIR }} -e basic
          git checkout ${{ env.PROJECT_DIR }}/config.h

      # and with 20 A CTs, about the resolution of the old board
      - name: Build firmware (new board, 20 A CTs)
        run: |
          sim/configs/sim_config.sh NEW 20
          PLATFORMIO_BUILD_DIR=.pio/build-new20 pio run --project-dir ${{ env.PROJECT_DIR }} -e basic
          git checkout ${{ env.PROJECT_DIR }}/config.h ${{ env.PROJECT_DIR }}/calibration.h
          sim/configs/sim_config.sh

      # the same grid, with the third load on a remote unit driven over RF
      - name: Build firmware (remote loads)
        run: |
          git apply --unidiff-zero sim/configs/remote_loads.patch
          pio run --project-dir ${{ env.PROJECT_DIR }} -e rf

      - name: Install simavr
        run: pio pkg install --global --tool platformio/tool-simavr

      # every scenario in parallel, the RF ones with the receiver firmware
      - name: Run grid scenarios
        run: make -C sim -j"$(nproc)" -k check check-new check-new20 check-rf

      # the same scenario must give the same result on both boards
      # old board, new board with 50 A CTs, new board with 20 A CTs: the same result
      - name: Compare the boards
        run: |
          make -C sim compare-boards
          make -C sim compare-boards-20
          make -C sim compare-ct

      - name: Report grid scenarios
        if: always()
        run: |
          {
            echo "### Grid simulation"
            echo '```'
            cat sim/out/*-summary.txt 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grid-sim
          path: sim/out/

  # Benchmark history (https://fredm67.github.io/PVRouter-3-phase/bench/): the cycle counts of the
  # embedded benchmarks and the size of every build, smaller is better. Each push to dev adds a
  # point to the history (gh-pages, folder bench/, kept by the doxygen deploy), and a commit more
  # than 2% worse than the previous point gets a comment. Pull requests get the report of the
  # pr-report job instead. The only job that writes to gh-pages here, in the same concurrency
  # group as the doxygen deploy.
  benchmarks:
    name: Benchmarks
    needs: [ build, test-embedded ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the history to gh-pages, comment on the commit
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: bench
          merge-multiple: true

      - name: Merge the sizes of the builds
        run: jq -s 'add' bench/size-*.json > bench/size.json

      - name: Speed
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Speed (simavr)
          tool: customSmallerIsBetter
          output-file-path: bench/speed.json
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '102%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Firmware size
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Firmware size
          tool: customSmallerIsBetter
          output-file-path: bench/size.json
          benchmark-data-dir-path: bench
          # gh-pages is already fetched, and holds the commit of the Speed step: fetching it again
          # fails (non-fast-forward) on pull requests, where nothing is pushed
          skip-fetch-gh-pages: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '102%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

  # The target branch of a pull request, measured as the PR is: the builds of the build matrix and
  # the embedded benchmarks, with the PR's scripts/ci/measure.sh (the target may predate it).
  baseline:
    name: Baseline (${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: target
          submodules: 'true'

      - uses: ./.github/actions/setup-platformio

      - name: Measure ${{ github.base_ref }}
        run: scripts/ci/measure.sh target baseline

      - name: Upload the figures of ${{ github.base_ref }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: |
            baseline/size.json
            baseline/speed.json

  # The report of a pull request, as ESPHome does it: the target branch against the PR (merged
  # into it, as CI builds it), flash and RAM of every build and every benchmark, in one comment
  # updated at each push. PRs from forks get it in the job summary only (read-only token).
  pr-report:
    name: Performance report
    needs: [ build, test-embedded, baseline ]
    # a failed baseline still gives a report, with the PR's figures alone
    if: github.event_name == 'pull_request' && !cancelled() && needs.build.result == 'success' && needs.test-embedded.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the comment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: pr
          merge-multiple: true

      - uses: actions/download-artifact@v8
        continue-on-error: true  # no baseline: the PR's figures alone
        with:
          name: baseline
          path: baseline

      - name: Write the report
        run: |
          jq -s 'add' pr/size-*.json > pr/size.json
          python3 scripts/ci/pr_report.py baseline pr "${{ github.base_ref }}" \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- pvrouter-bench-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh pr comment "$PR" --body-file report.md
          fi
